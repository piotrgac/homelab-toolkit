[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-toolkit"
version = "0.1.0"
description = "Generate docker-compose, terraform and ansible from a single YAML config"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.scripts]
homelab = "homelab_toolkit.cli:cli"

[tool.setuptools.packages.find]
include = ["homelab_toolkit*"]
